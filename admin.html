<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MR ALL IN — Admin</title>

  <link
    rel="icon"
    href="assets/logo.png"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main class="admin-container">

    <!-- LOGIN -->

    <section
      id="loginSection"
      class="admin-login"
    >

      <img
        src="assets/logo.png"
        alt="MR ALL IN"
        style="
          width: 150px;
          height: auto;
          margin: 0 auto 20px;
          object-fit: contain;
        "
      >

      <h1>
        Admin MR ALL IN
      </h1>

      <p>
        Masuk untuk mengelola produk toko.
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="adminPassword">
            Password Admin
          </label>

          <input
            id="adminPassword"
            type="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >

        </div>

        <button type="submit">
          Masuk ke Admin
        </button>

      </form>

      <div
        id="loginError"
        class="admin-error"
      >
        Password salah.
      </div>

    </section>


    <!-- ADMIN PANEL -->

    <section
      id="adminPanel"
      style="display: none;"
    >

      <!-- HEADER -->

      <div class="admin-header">

        <div>

          <h1>
            Dashboard Admin
          </h1>

          <p>
            Kelola produk, harga dan stok MR ALL IN.
          </p>

        </div>

        <div class="admin-actions">

          <a
            href="index.html"
          >
            Lihat Toko
          </a>

          <button
            id="logoutButton"
            type="button"
          >
            Keluar
          </button>

        </div>

      </div>


      <!-- STATS -->

      <div class="admin-stats">

        <div class="admin-stat">

          <span>
            Total Produk
          </span>

          <strong id="totalProducts">
            0
          </strong>

        </div>

        <div class="admin-stat">

          <span>
            Produk Tersedia
          </span>

          <strong id="availableProducts">
            0
          </strong>

        </div>

        <div class="admin-stat">

          <span>
            Stok Total
          </span>

          <strong id="totalStock">
            0
          </strong>

        </div>

      </div>


      <!-- CONTENT -->

      <div class="admin-layout">


        <!-- FORM -->

        <section class="admin-form">

          <h2 id="formTitle">
            Tambah Produk
          </h2>

          <form id="productForm">

            <input
              id="productId"
              type="hidden"
            >


            <div class="form-group">

              <label for="productName">
                Nama Produk
              </label>

              <input
                id="productName"
                type="text"
                placeholder="Contoh: RTX 3060 12GB"
                required
              >

            </div>


            <div class="form-group">

              <label for="productCategory">
                Kategori
              </label>

              <select
                id="productCategory"
                required
              >

                <option value="">
                  Pilih kategori
                </option>

              </select>

            </div>


            <div class="form-group">

              <label for="productPrice">
                Harga
              </label>

              <input
                id="productPrice"
                type="number"
                min="0"
                placeholder="3450000"
                required
              >

            </div>


            <div class="form-group">

              <label for="productStock">
                Stok
              </label>

              <input
                id="productStock"
                type="number"
                min="0"
                placeholder="1"
                required
              >

            </div>


            <div class="form-group">

              <label for="productSpecs">
                Spesifikasi
              </label>

              <textarea
                id="productSpecs"
                placeholder="12GB GDDR6&#10;192-bit&#10;Ray Tracing • DLSS"
              ></textarea>

              <div class="form-help">
                Satu spesifikasi per baris.
              </div>

            </div>


            <div class="form-group">

              <label for="productIcon">
                Icon
              </label>

              <input
                id="productIcon"
                type="text"
                maxlength="4"
                placeholder="▰"
              >

            </div>


            <div class="form-buttons">

              <button
                id="cancelEdit"
                class="form-cancel"
                type="button"
                style="display: none;"
              >
                Batal
              </button>

              <button
                class="form-submit"
                type="submit"
              >
                Simpan Produk
              </button>

            </div>

          </form>

        </section>


        <!-- PRODUCT LIST -->

        <section>

          <div
            class="section-heading"
            style="margin-bottom: 18px;"
          >

            <div>

              <span class="section-label">
                INVENTORY
              </span>

              <h2>
                Daftar Produk
              </h2>

            </div>

          </div>

          <div
            id="adminProductList"
            class="admin-product-list"
          ></div>

        </section>

      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="products.js"></script>
<script src="admin.js"></script>

</body>
</html>
