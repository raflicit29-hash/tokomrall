<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - MR ALL IN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #0d1b2e;
      border: 1px solid #1d3552;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      color: #9fb0c5;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #29415e;
      background: #081525;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #1683ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0875ed;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Reset Password</h1>
    <p>Masukkan password baru untuk akun admin MR ALL IN.</p>

    <form id="resetForm">
      <label for="password">Password baru</label>
      <input
        id="password"
        type="password"
        minlength="6"
        required
        placeholder="Minimal 6 karakter"
      >

      <label for="confirmPassword">Ulangi password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        required
        placeholder="Ulangi password"
      >

      <button type="submit">Simpan Password Baru</button>

      <div id="message"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Password tidak sama.";
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password minimal 6 karakter.";
        return;
      }

      message.textContent = "Menyimpan password...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Gagal: " + error.message;
        return;
      }

      message.textContent =
        "Password berhasil diubah. Silakan login kembali ke halaman admin.";

      setTimeout(() => {
        window.location.href = "admin.html";
      }, 2000);
    });
  </script>

</body>
</html>
